packages:
  - "libs/ts-shared"
  - "packages/web-app"
  - "packages/mcp-proxy"
  - "smithy-generated/control-plane-typescript-client"
  - "smithy-generated/data-layer-typescript-client"
allowBuilds:
  esbuild: true
  nx: true

# Supply chain hardening — settings must live at the top level; nested groups
# like `packageManagerStrictness` or `pnpm.auditConfig.minReleaseAge` are
# silently ignored by pnpm.
#   * minimumReleaseAge (pnpm 10.16+): quarantine newly-published packages
#     for 7 days (10080 minutes) before allowing install.
#   * trustPolicy (pnpm 10.21+): block silent downgrades of package integrity
#     / provenance settings.
#   * blockExoticSubdeps (pnpm 10.26+): only direct dependencies may use
#     exotic sources (git repos, direct tarball URLs). Transitive deps must
#     resolve from a trusted source — the registry, local file paths,
#     workspace links, or the trusted GitHub repos (node, bun, deno).
#     Note: pnpm 11 makes this the default; on the pinned 10.34.5 it is not.
minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true

# These exact versions predate the policy activation and are pinned by the
# committed lockfile. pnpm 11+ audits frozen lockfiles and reports them as trust
# downgrades because their registry evidence is weaker than an earlier publish.
# Keep the exceptions version-scoped so upgrades are evaluated normally.
trustPolicyExclude:
  - pnpm@10.34.5
  - semver@6.3.1
  - undici-types@6.21.0

overrides:
  # downlevel-dts depends on typescript@"next" — a dist-tag that resolves to
  # whatever nightly was published that day. So `pnpm install` pulls a build that
  # is hours old, and the minReleaseAge quarantine above then rejects the lockfile
  # it just produced. This is not a stale lockfile: re-resolving reproduces it,
  # because the tag keeps moving. A fresh clone fails `make setup` outright, with
  # node_modules left empty and every TS target (web-app, Nx) unusable.
  #
  # Scoped to downlevel-dts rather than overriding typescript globally: the
  # workspace packages pin real ranges (^5.6.0 for web-app and ts-shared,
  # ^6.0.3 for mcp-proxy) and a blanket override would drag them all
  # onto one version. downlevel-dts only rewrites .d.ts files for older
  # consumers — a build-time tool inside the Smithy-generated clients, not
  # something whose exact compiler version changes what ships.
  "downlevel-dts>typescript": 6.0.3
  # axios <1.20.0 — CVE (GHSA, HIGH). 1.20.0 is the patched floor; same major.
  axios: 1.20.0
  # brace-expansion stack-exhaustion DoS (GHSA, HIGH). Nested-brace recursion
  # in parseCommaParts/expand_ (CVE-2026-14257 and its parsing-side counterpart).
  # Patched floors: v1 >=1.1.20, v2 >=2.1.6, v5 >=5.0.11. Range-scoped so each
  # major stays on its own line (a blanket pin would cross majors).
  "brace-expansion@<1.1.20": 1.1.20
  "brace-expansion@>=2.0.0 <2.1.6": 2.1.6
  "brace-expansion@>=4.0.0 <5.0.11": 5.0.11
  fast-xml-builder: 1.1.7
  form-data: 4.0.6
  js-yaml: 3.15.2
  minimatch@9.0.3: 9.0.7
  postcss: 8.5.23
  react-router: 6.30.6
  react-router-dom: 6.30.6
  tmp: 0.2.7
  vite: 6.4.3
  ws: 8.21.0
  # Dependabot CVE transitive bumps (upgrade-only; scoped to avoid cross-major downgrades)
  nanoid@3: 3.3.19
  browserslist: 4.28.8
  baseline-browser-mapping: 2.11.19
  "@babel/core": 7.29.7
  # nx 22.7.x pins smol-toml 1.6.1; 1.7.1 carries the CVE fix (same major).
  "smol-toml@1.6.1": 1.7.1
  # source-map-js <1.2.2 — event-loop DoS (GHSA-68fv-2mgg-jv7q, HIGH). Transitive
  # via vite/postcss in web-app. 1.2.2 is the patched floor; same major.
  "source-map-js@<1.2.2": 1.2.2
  # zod <4.6.6 — uncontrolled resource consumption / memory exhaustion on
  # unbounded array schemas (GHSA, HIGH). 4.6.6 is the patched floor; same major.
  "zod@<4.6.6": 4.6.6
  # handlebars <4.7.10 — critical RCE (GHSA-p8wg-vrv2-v86f, GHSA-8r5x-fm3f-whwj).
  "handlebars@<4.7.10": 4.7.10

# zod 4.6.6 (the security override above) was published 2026-10-11, within the
# 7-day quarantine window. Excluded here so the override resolves; remove this
# entry once 4.6.6 ages past the quarantine (after 2026-10-18).
minimumReleaseAgeExclude:
  - zod
