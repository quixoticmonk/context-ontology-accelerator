# terraform-docs configuration shared by every module under infra-tf/modules/.
# Run via `make docs` (writes) or `make docs-check` (fails on drift).
#
# Inject mode only rewrites the block between the BEGIN_TF_DOCS / END_TF_DOCS
# markers, so hand-written prose above or below (e.g. the databricks
# connector README) is preserved.
formatter: markdown table

version: ">= 0.20.0, < 1.0.0"

sections:
  show:
    - requirements
    - providers
    - modules
    - resources
    - inputs
    - outputs

output:
  file: README.md
  mode: inject
  template: |-
    <!-- BEGIN_TF_DOCS -->
    {{ .Content }}
    <!-- END_TF_DOCS -->

sort:
  enabled: true
  by: required

settings:
  anchor: false
  color: true
  default: true
  description: true
  escape: true
  hide-empty: true
  html: false
  indent: 2
  lockfile: false
  read-comments: true
  required: true
  sensitive: true
  type: true
