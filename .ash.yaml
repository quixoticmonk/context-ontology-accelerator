# yaml-language-server: $schema=https://raw.githubusercontent.com/awslabs/automated-security-helper/refs/heads/main/automated_security_helper/schemas/AshConfig.json
project_name: context-ontology-accelerator
global_settings:
  severity_threshold: MEDIUM
  ignore_paths:
    - path: '**/.terraform/**'
      reason: 'vendored Terraform provider plugins and modules'
    - path: 'infra-tf/**/.terraform/**'
      reason: 'vendored Terraform provider plugins and modules'
    - path: 'infra-tf/artifacts/**'
      reason: 'generated build artifacts (openapi merged.json, lambda zips, image tags) - not source'
    - path: '.github/**'
      reason: 'GitHub Actions workflows and composite actions scanned separately'
    - path: '**/node_modules/**'
      reason: 'third-party JS/TS dependencies'
    - path: '**/.venv/**'
      reason: 'Python virtualenvs'
    - path: '**/venv/**'
      reason: 'Python virtualenvs'
    - path: '**/__pycache__/**'
      reason: 'Python bytecode cache'
    - path: '**/.mypy_cache/**'
      reason: 'mypy cache'
    - path: '**/.pytest_cache/**'
      reason: 'pytest cache'
    - path: '**/.ruff_cache/**'
      reason: 'ruff cache'
    - path: '**/.uv-cache/**'
      reason: 'uv cache'
    - path: '**/.pip-cache/**'
      reason: 'pip cache'
    - path: '**/.nx/**'
      reason: 'Nx cache'
    - path: '**/.pnpm-store/**'
      reason: 'pnpm content-addressable store'
    - path: '**/dist/**'
      reason: 'build output'
    - path: '**/build/**'
      reason: 'build output'
    - path: '**/*.egg-info/**'
      reason: 'Python packaging metadata'
    - path: '**/smithy-generated/**'
      reason: 'generated Smithy code (regenerated by make generate)'
    - path: '.ash/**'
      reason: 'ASH output artifacts'
    - path: '**/ash_output/**'
      reason: 'ASH output artifacts'
    - path: 'external-docs/**'
      reason: 'vendored third-party documentation'
    - path: '**/coverage/**'
      reason: 'coverage reports'
    - path: '**/*.lock'
      reason: 'lockfiles (uv.lock, pnpm-lock.yaml, etc.)'
    - path: '**/pnpm-lock.yaml'
      reason: 'pnpm lockfile'
    - path: 'tests/**'
      reason: 'test code and fixtures (may contain synthetic secrets/data)'
    - path: '**/tests/**'
      reason: 'test code and fixtures in sub-packages'
    - path: '**/__tests__/**'
      reason: 'JS/TS test directories'
    - path: '**/*.test.*'
      reason: 'JS/TS test files'
    - path: '**/*.spec.*'
      reason: 'JS/TS spec files'
    - path: '**/test_*.py'
      reason: 'pytest test modules'
    - path: '**/*_test.py'
      reason: 'pytest test modules'
    - path: '**/*.md'
      reason: 'markdown docs — example snippets and placeholders'
    - path: '**/*.mdx'
      reason: 'MDX docs'
    - path: '**/*.rst'
      reason: 'reStructuredText docs'
    - path: 'docs/**'
      reason: 'documentation directory'
    - path: '**/docs/**'
      reason: 'nested documentation directories'
    - path: '**/README*'
      reason: 'README files — example creds/placeholders'
    - path: '**/CHANGELOG*'
      reason: 'changelog files'
    - path: '**/CONTRIBUTING*'
      reason: 'contribution guides'
  suppressions: []
fail_on_findings: true
ash_plugin_modules: []
external_reports_to_include: []
build: null
converters:
  archive:
    name: archive
    enabled: true
    options: {}
  jupyter:
    name: jupyter
    enabled: true
    options:
      tool_version: '>=7.16.0,<8.0.0'
      install_timeout: 300
scanners:
  bandit:
    name: bandit
    enabled: true
    options:
      severity_threshold: null
      config_file: null
      confidence_level: all
      ignore_nosec: false
      excluded_paths: []
      additional_formats: []
      tool_version: '>=1.7.0,<2.0.0'
      install_timeout: 300
  cdk-nag:
    name: cdk-nag
    enabled: true
    options:
      severity_threshold: null
      nag_packs:
        AwsSolutionsChecks: true
        HIPAASecurityChecks: false
        NIST80053R4Checks: false
        NIST80053R5Checks: false
        PCIDSS321Checks: false
  cfn-nag:
    name: cfn-nag
    enabled: true
    options:
      severity_threshold: null
  checkov:
    name: checkov
    enabled: true
    options:
      severity_threshold: null
      config_file: null
      # GitHub Actions workflows / composite actions — not being
      # ported (target CI/CD is a different platform). The global
      # ignore_paths .github/** is not honored by checkov, so it
      # is repeated here at the scanner level.
      skip_path:
      - path: '.github/'
        reason: 'GitHub Actions workflows and composite actions not being ported'
      - path: 'tests/'
        reason: 'Test files and fixtures (mirrors global ignore_paths; checkov does its own file discovery and does not honor the global list)'
      additional_formats:
      - cyclonedx_json
      offline: false
      frameworks:
      - all
      skip_frameworks: []
      tool_version: null
      install_timeout: 300
  detect-secrets:
    name: detect-secrets
    enabled: true
    options:
      severity_threshold: null
      # Baseline provides `filters_used` config (should_exclude_file
      # + should_exclude_line regex patterns) that ASH loads into
      # detect-secrets' scan settings. Suppression is regex-based —
      # `is_secret: false` in the results section is NOT respected
      # by ASH (it only reads plugins_used and filters_used from the
      # baseline). Regenerate with: detect-secrets scan --baseline .secrets.baseline
      #
      # Filter rationale (see .secrets.baseline `filters_used`):
      # File-level exclusions:
      #   * .secrets.baseline itself (its hash values look high-entropy)
      #   * infra-tf/artifacts/** - generated OpenAPI merged.json
      #   * models/src/main/smithy/*-examples.smithy - Smithy @examples
      #     with ULIDs and base64-encoded example Turtle content
      # Line-level exclusions (each verified against its target line):
      #   * Databricks JDBC parameter KEY-name constants (client_secret,
      #     OAuth2Secret, PWD, CREDENTIAL_SECRET_ARN)
      #   * simplelogger.properties comment about JDBC driver PWD= risk
      #   * VPC endpoint DNS name (com.amazonaws.<region>.secretsmanager)
      #   * React form validation error message
      baseline_file: .secrets.baseline
      scan_settings:
        version: null
        generated_at: null
        plugins_used: []
        filters_used: []
        results: {}
  grype:
    name: grype
    enabled: true
    options:
      severity_threshold: null
      config_file: null
      offline: false
  npm-audit:
    name: npm-audit
    enabled: true
    options:
      severity_threshold: null
      offline: false
  opengrep:
    name: opengrep
    enabled: true
    options:
      severity_threshold: null
      config: auto
      exclude:
      - '*-converted.py'
      - '*_report_result.txt'
      # GitHub Actions workflows / composite actions — not being
      # ported (target CI/CD is a different platform). The global
      # ignore_paths .github/** is not honored by opengrep, so it
      # is repeated here at the scanner level.
      - '.github'
      - '.github/**'
      # X-Ray tracing is not part of our observability strategy
      # (CloudWatch/OTEL are used instead), so this rule is
      # intentionally excluded from the scan.
      exclude_rule:
      - terraform.aws.security.aws-lambda-x-ray-tracing-not-active.aws-lambda-x-ray-tracing-not-active
      severity: []
      metrics: auto
      offline: false
      patterns: []
      version: v1.15.1
  semgrep:
    name: semgrep
    enabled: false
    options:
      severity_threshold: null
      config: auto
      exclude:
      - '*-converted.py'
      - '*_report_result.txt'
      # GitHub Actions workflows / composite actions — not being
      # ported. Mirrors opengrep exclusion so re-enabling semgrep
      # doesn't re-introduce .github/** noise.
      - '.github'
      - '.github/**'
      # Mirrors opengrep exclude_rule — X-Ray tracing is not part
      # of our observability strategy, so re-enabling semgrep
      # should not re-introduce these findings.
      exclude_rule:
      - terraform.aws.security.aws-lambda-x-ray-tracing-not-active.aws-lambda-x-ray-tracing-not-active
      severity: []
      metrics: auto
      offline: false
      tool_version: null
      install_timeout: 300
  syft:
    name: syft
    enabled: true
    options:
      severity_threshold: null
      config_file: null
      exclude: []
      additional_outputs:
      - syft-table
reporters:
  csv:
    name: csv
    enabled: true
    options: {}
    extension: csv
  cyclonedx:
    name: cyclonedx
    enabled: true
    options: {}
    extension: cdx.json
  html:
    name: html
    enabled: true
    options: {}
    extension: html
  flat-json:
    name: flat-json
    enabled: true
    options:
      include_scanner_metrics: true
      include_summary_metrics: true
      include_metadata: true
    extension: flat.json
  gitlab-sast:
    name: gitlab-sast
    enabled: true
    options: {}
    extension: gl-sast-report.json
  junitxml:
    name: junitxml
    enabled: true
    options:
      respect_severity_threshold: true
    extension: junit.xml
  markdown:
    name: markdown
    enabled: true
    options:
      include_summary: true
      include_findings_table: false
      include_detailed_findings: true
      max_detailed_findings: 20
      top_hotspots_limit: 10
      use_collapsible_details: true
    extension: summary.md
  ocsf:
    name: ocsf
    enabled: true
    options: {}
    extension: ocsf.json
  sarif:
    name: sarif
    enabled: true
    options: {}
    extension: sarif
  spdx:
    name: spdx
    enabled: false
    options: {}
    extension: spdx.json
  text:
    name: text
    enabled: true
    options:
      include_summary: true
      include_findings_table: false
      include_detailed_findings: false
      max_detailed_findings: 20
      top_hotspots_limit: 20
    extension: summary.txt
  yaml:
    name: yaml
    enabled: false
    options: {}
    extension: yaml
mcp-resource-management:
  max_concurrent_scans: 3
  max_concurrent_tasks: 20
  thread_pool_max_workers: 4
  scan_timeout_seconds: 1800
  operation_timeout_seconds: 180
  shutdown_timeout_seconds: 30
  memory_warning_threshold_mb: 1024
  memory_critical_threshold_mb: 2048
  task_count_warning_threshold: 15
  max_message_size_bytes: 10485760
  max_path_length: 4096
  max_directory_size_mb: 1000
  enable_health_checks: true
  health_check_interval_seconds: 60
  enable_resource_logging: true
  log_resource_operations: false
