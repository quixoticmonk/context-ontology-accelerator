# Repo-level checkov config for the Terraform infra layer.
#
# Suppressions here are the exceptions we've explicitly accepted after
# review. Each entry MUST carry a rationale. Anything not listed is
# still enforced.

# ═════════════════════════════════════════════════════════════════════
#  Global skip-check list
# ═════════════════════════════════════════════════════════════════════
skip-check:
  # CKV2_AWS_34 — "AWS SSM Parameter should be Encrypted" (SecureString).
  #
  # RATIONALE:
  #   Every aws_ssm_parameter in this repo stores non-sensitive
  #   cross-stack references — ECR repository URLs and ARNs, VPC and
  #   subnet IDs, DataZone domain IDs, Cloud Map namespace IDs, ECS
  #   cluster ARNs, Cognito user-pool IDs, service endpoint hostnames.
  #   These are configuration outputs consumed by downstream stacks
  #   and Lambda functions; none of them are secrets.
  #
  # WHERE SECRETS LIVE:
  #   Actual sensitive material — JDBC credentials, OIDC client
  #   secrets, third-party API tokens — is stored in AWS Secrets
  #   Manager (see modules/services/sources/iam_db.tf and the
  #   credential-secret onboarding flow). Secrets Manager already
  #   encrypts with KMS by default and each secret is namespace-tagged
  #   for tenant-scoped access.
  #
  # POLICY MAPPING:
  #   Corp policy 7.1 requires KMS for services storing SENSITIVE
  #   data. SSM parameters here do not qualify. This workload is
  #   non-regulated, so 7.2 (CMK) is not required.
  #
  # WHEN TO REMOVE THIS SKIP:
  #   - This workload is reclassified as Regulated (7.2 applies)
  #   - An SSM parameter is added that stores sensitive data
  #     (in which case, move it to Secrets Manager instead of
  #     flipping the type to SecureString)
  - CKV2_AWS_34

  # CKV_AWS_173 — "Check encryption settings for Lambda environmental
  # variables".
  #
  # RATIONALE:
  #   AWS Lambda encrypts function environment variables at rest with
  #   the AWS-managed `aws/lambda` key by default. That satisfies
  #   policy 7.1 (baseline KMS) without any explicit configuration.
  #   The check demands `kms_key_arn` be set explicitly on the
  #   function, but the encryption is already happening.
  #
  #   Env-var contents in this repo are non-sensitive configuration —
  #   SSM parameter paths, DynamoDB table names, S3 bucket names,
  #   service endpoint URLs, Bedrock model IDs. Actual credentials
  #   are always fetched at runtime from Secrets Manager, not baked
  #   into env vars.
  #
  # POLICY MAPPING:
  #   Corp policy 7.1 is satisfied by default AWS-managed encryption
  #   on the `aws/lambda` key. This workload is non-regulated so 7.2
  #   (CMK with least-privilege key policies) does not apply.
  #
  # WHEN TO REMOVE THIS SKIP:
  #   - This workload is reclassified as Regulated (switch to a CMK
  #     under a Lambda-scoped key policy)
  #   - A Lambda is added that legitimately carries sensitive values
  #     in env vars (in which case, prefer moving those values to
  #     Secrets Manager instead of adding a CMK)
  - CKV_AWS_173

  # CKV_AWS_50 — "X-Ray tracing is enabled for Lambda".
  #
  # RATIONALE:
  #   AWS X-Ray is not the APM choice for this workload. Datadog is
  #   the target APM/tracing platform; the Datadog Lambda extension
  #   (or a Datadog agent sidecar for ECS) provides distributed
  #   tracing, span aggregation, and service dependency mapping
  #   already, with a single vendor and single-pane-of-glass view
  #   across the Lambda + ECS surface area.
  #
  #   Enabling X-Ray in parallel would:
  #     - Duplicate tracing work at the runtime layer (both X-Ray SDK
  #       and Datadog libraries instrumenting the same code paths)
  #     - Duplicate storage/analysis costs
  #     - Complicate trace correlation (two separate trace-ID
  #       namespaces to reconcile)
  #     - Add IAM surface (xray:PutTraceSegments, PutTelemetryRecords)
  #       to every Lambda execution role
  #
  # WHEN TO REMOVE THIS SKIP:
  #   - Datadog is dropped as the APM target and X-Ray is adopted
  #     (or in addition to Datadog for a specific compliance driver)
  #   - A specific Lambda needs X-Ray for AWS-native service map
  #     visualization that Datadog cannot provide
  - CKV_AWS_50

  # CKV_AWS_272 — "Ensure AWS Lambda function is configured to
  # validate code-signing".
  #
  # RATIONALE:
  #   Lambda code signing is not currently required for this workload.
  #   A code-signing config would require a Signer signing profile, a
  #   signed package flow at build time, and per-function
  #   `code_signing_config_arn` wiring. None of that infrastructure
  #   exists here today — introducing it would be a green-field
  #   supply-chain project, not a compliance quick fix.
  #
  #   Supply-chain integrity is currently addressed by:
  #     - ECR image tag IMMUTABLE (CKV_AWS_51) — image content locked
  #       to a specific tag once pushed
  #     - ECR scan-on-push enabled (CKV_AWS_163) — vulnerability scan
  #       on every image
  #     - Git-SHA-based image tags — traceable provenance from tag to
  #       source commit
  #     - Lambda zip artifacts built in a controlled build environment
  #       and their content-hash tracked by Terraform (source_code_hash)
  #
  # WHEN TO REMOVE THIS SKIP:
  #   - A formal code-signing pipeline is introduced (AWS Signer
  #     profile + signed-package build workflow + Lambda code_signing_config
  #     resources)
  #   - Compliance framework mandates code signing (e.g., regulated
  #     financial workload with SLSA level 3+ requirements)
  - CKV_AWS_272

  # CKV_AWS_116 — "Ensure that AWS Lambda function is configured for a
  # Dead Letter Queue (DLQ)".
  #
  # RATIONALE:
  #   Sync API-Gateway backends do not benefit from DLQs; async
  #   workers use SQS-native DLQs on their source queues (see
  #   modules/services/sources/sqs.tf `redrive_policy`).
  #
  #   The check flags every Lambda that lacks a `dead_letter_config`
  #   block, but that pattern only fits async invocations where a
  #   failure would otherwise be silently lost. This workload's
  #   Lambdas split into three groups:
  #     - Sync API-Gateway handlers (namespace_api, roles_api,
  #       grants_api, metric_api, sources_api, ontology.api_proxy,
  #       authorizer, stub) — the caller receives the error response
  #       directly, so a Lambda-level DLQ adds no value
  #     - Async workers (bulk_review_worker, db_scan_trigger,
  #       doc_trigger, preprocessing, federation_provisioner,
  #       cache_invalidation, deletion pipeline functions) — these
  #       consume from SQS queues that carry their own DLQ via
  #       `redrive_policy`, so failed events land in the queue-side
  #       DLQ rather than a Lambda-side one
  #     - One-shot provisioning Lambdas (cognito_patch, api_cors_patch,
  #       lakeformation_admin, vkg.reload) — invoked by Step Functions
  #       or Terraform lifecycle actions with their own error handling
  #
  # WHEN TO REMOVE THIS SKIP:
  #   - A specific Lambda is identified whose failures need Lambda-
  #     level DLQ capture (async invocation without a source queue,
  #     e.g., EventBridge-triggered function that must not silently
  #     drop events)
  #   - Move that function to an inline `dead_letter_config` block
  #     and add a `# checkov:skip=CKV_AWS_116:covered-by-source-queue`
  #     on the remaining ones instead of a repo-wide skip
  - CKV_AWS_116

  # CKV_AWS_65 — "Ensure container insights are enabled on ECS
  # cluster".
  #
  # RATIONALE:
  #   Container Insights is currently optional for this workload.
  #   Enabling it turns on per-task CPU/memory/network metrics
  #   aggregated to CloudWatch, which is useful but adds a per-hour
  #   metric-ingestion cost and duplicates signal already captured
  #   by the target APM stack (Datadog — see the CKV_AWS_50 skip).
  #
  #   Datadog's ECS integration collects the same task-level metrics
  #   plus richer application-level tracing, so paying for Container
  #   Insights in parallel is duplicated cost with no incremental
  #   observability.
  #
  # WHEN TO REMOVE THIS SKIP:
  #   - Datadog is dropped as the observability target and Container
  #     Insights becomes the primary ECS metrics source
  #   - Regulatory posture requires AWS-native metrics for audit
  #     (Container Insights writes into a CloudWatch namespace that
  #     stays inside the account boundary, unlike a SaaS APM)
  #   - A specific cluster needs CloudWatch metrics for an alarm
  #     that has to fire from within AWS (e.g., a lifecycle guard)
  - CKV_AWS_65
